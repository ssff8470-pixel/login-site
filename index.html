<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная — Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Вход на сайт</h1>
      <p class="login-subtitle">Введите ваши данные для входа</p>

      <form class="login-form" action="#" method="post">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" placeholder="Введите логин" required>
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Введите пароль" required>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" name="remember"> Запомнить меня
          </label>
          <a href="#" class="forgot-link">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-login">Войти</button>
      </form>

      <p class="signup-text">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
